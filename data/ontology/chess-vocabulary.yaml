  # having done anything to prevent an enemy bombardment of the position, would
  # it ever occur to me to speak of a conquest of the terrain? Obviously not. »
  # Lasker donne la définition opératoire du second : « The more space you
  # dominate […] the more restricted the number of moves » adverses.
  # ==========================================================================
  - key: pawn_advance_edge
    facet: space
    label: "Avance des pions — l'espace OCCUPÉ"
