    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
      - { key: released,    label: "Relâchée — structures fixées, pas de contact" }
      - { key: building,    label: "Montante — contacts non résolus" }
      - { key: critical,    label: "Critique — une prise change la nature de la position" }

