      - { key: discovered_attack, label: "Attaque à la découverte disponible" }
      - { key: hanging_piece,     label: "Pièce en l'air" }
      - { key: mate_net,          label: "Réseau de mat en formation" }
      - { key: overload,          label: "Défenseur surchargé exploitable" }
      # PORTÉE : la déviation POSITIONNELLE — un défenseur unique délogeable de force,
      # sa cible tombant alors avec gain. La déviation SACRIFICIELLE (Botvinnik 30.Ba3,
      # où l'on offre une pièce pour attirer la dame) exige une recherche de variantes :
      # elle est hors de portée d'un détecteur sans moteur. L'absence de `deflection` ne
      # dit donc pas « aucune déviation », mais « aucune déviation de ce type-là ».
      - { key: deflection,        label: "Déviation : un défenseur unique peut être délogé de sa tâche" }
      - { key: zugzwang,          label: "Zugzwang" }

  - key: weakest_link
    facet: threats
    label: "Cible désignée par la ligne de moindre résistance (Lasker : « linea minoris resistentiae »)"
    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
