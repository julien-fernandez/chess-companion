  # measure of the degree of co-operation of the pieces. » Kotov décrit le geste
  # correspondant : « In a more subconscious than conscious way he will establish
  # where there is co-operation and harmony between his pieces. »
  # ==========================================================================
  - key: piece_cooperation
    facet: cooperation
    label: "Qualité de la coopération entre pièces (Lasker)"
    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
      - { key: equal,        label: "Comparable" }
      - { key: white_better, label: "Pièces blanches mieux coordonnées" }
      - { key: black_better, label: "Pièces noires mieux coordonnées" }

  - key: function_overload
    facet: cooperation
    label: "Pièce surchargée de fonctions (Lasker : « overburdened with functions »)"
    nature: measured
