      - { key: closed,     label: "Fermée — guerre de siège" }
      - { key: semi_open,  label: "Semi-ouverte" }
      - { key: blocked,    label: "Verrouillée — Nimzowitsch conseille de rester « in the air » plutôt que d'y entrer" }

  # ==========================================================================
  # FACETTE — ELASTICITY
  # ----------------------------------------------------------------------------
  # La facette que trois auteurs nomment séparément et qu'aucune liste moderne ne
  # porte. Nimzowitsch : « capacity for manœuvring ». Lasker : « increase the
  # range of possible plans to follow without specifying too early which road you
  # would prefer to travel ». Capablanca : « Keep freedom of manoeuvre while
  # hampering your opponent. » Ce n'est ni la mobilité (coups légaux) ni
  # l'activité (portée) : c'est l'option non encore consommée.
  # ==========================================================================
  - key: plan_openness
    facet: elasticity
    label: "Nombre de plans encore ouverts (Lasker)"
    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
      - { key: equal,        label: "Comparable" }
      - { key: white_freer,  label: "Les blancs gardent plus d'options" }
      - { key: black_freer,  label: "Les noirs gardent plus d'options" }
      - { key: both_forced,  label: "Les deux camps sont contraints à un plan unique" }

  - key: piece_elasticity
    facet: elasticity
    label: "Pièces qui peuvent quitter leur poste sans que leur fonction s'effondre (Nimzowitsch)"
    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
      - { key: equal,        label: "Comparable" }
      - { key: white_better, label: "Pièces blanches plus élastiques" }
      - { key: black_better, label: "Pièces noires plus élastiques" }

