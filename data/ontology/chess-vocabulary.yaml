      - { key: black_target,  label: "La cible est dans le camp noir" }
      - { key: mutual,        label: "Une cible de chaque côté" }

  # ==========================================================================
  # FACETTE — REGIME
  # ----------------------------------------------------------------------------
  # Lasker corrige Steinitz en ajoutant un troisième état. En position équilibrée,
  # le bon plan n'est ni attaquer ni défendre mais « to maintain the co-operation
  # of his pieces ». Une ontologie qui ne dit que « qui est mieux » perd l'état le
  # plus fréquent — et c'est celui où un companion a le plus à dire.
  # ==========================================================================
  - key: position_regime
    facet: regime
    label: "Régime de la position (Lasker, d'après Steinitz)"
    nature: measured
    source: engine
    cardinality: single
    status: probation
    values:
      - { key: white_attacks,  label: "Les blancs ont un avantage non compensé : ils doivent attaquer" }
      - { key: black_attacks,  label: "Les noirs ont un avantage non compensé : ils doivent attaquer" }
      - { key: balanced,       label: "Équilibrée — maintenir la coopération des pièces" }

  # Lasker impose le mot : « A true, genuine balance does not exist in our game
  # […] For the practical needs of Chess the concept ''compensation'' suffices. »
  - key: compensation
    facet: regime
    label: "Nature de la compensation, quand les avantages ne sont pas de même espèce (Lasker)"
    nature: measured
    source: engine
    cardinality: single
    status: probation
    values:
