# ============================================================================
# chess-vocabulary.yaml — SOURCE CANONIQUE de l'ontologie « état du jeu d'échecs »
# ============================================================================
# Décision 2026-09-04 (Julien) : ce YAML est la SOURCE UNIQUE du vocabulaire qui
# décrit l'état d'une position. Il vit ICI, dans le repo qui produit le companion
# — PAS dans le vault (hors périmètre des coaches claude.ai).
#
# Diffusion = moteur ontology-manager (julien-fernandez/ontology-manager), `kind: chess`.
# Sens de dérivation = yaml -> tout : enum Python + JSON. Le JSON est le seul
# artefact consommé ici (l'app est en JS). Ne PAS éditer les valeurs ailleurs.
#
# Décisions fondatrices : ADR 0001 (docs/decisions/).
# Corpus de sourcing du vocabulaire : docs/vocabulaire-perception-echecs.md —
# chaque terme ci-dessous porte l'auteur qui l'emploie, quand il est attesté.
#
# ----------------------------------------------------------------------------
# POURQUOI CETTE ONTOLOGIE EXISTE
# ----------------------------------------------------------------------------
# `web/src/chess/coach.js` ne connaît que la delta d'évaluation Stockfish : gaffe,
# imprécision, meilleur coup. Aucun mot positionnel. Un joueur fort ne lit pas une
# position comme un score — il la lit comme un paysage de relations. Silman nomme
# la fonction attendue : « the imbalances deconstruct it in a way that makes it
# user friendly. In effect, the imbalances act as a roadmap that shows each side
# what to do. »
#
# ----------------------------------------------------------------------------
# ⚠️ TROIS CONTRAINTES QUI PORTENT TOUT LE MODÈLE
# ----------------------------------------------------------------------------
# C1 — DÉTERMINISME. Aucun axe `judged`, aucune source LLM. Chaque valeur se
#      calcule depuis le FEN (`fen`), la géométrie des coups légaux (`rules`) ou
#      le moteur (`engine`). Motif mesuré : DecodeChess met ~60 s à décoder UNE
#      position par LLM — inutilisable pour un companion vocal temps réel.
#
# C2 — CATÉGORIEL PUR. Toute mesure continue (score matériel, mobilité comptée,
#      évaluation moteur) est découpée en paliers à valeurs fermées ICI ; le
#      nombre brut reste dans le schéma de l'app, jamais dans ce fichier.
#      L'ontologie donne le LABEL, l'app garde la MESURE à côté.
#
# C3 — AXES COMPARATIFS. Un axe qualifie la POSITION, pas un camp. Les valeurs
#      encodent donc l'écart entre les deux camps, ce qui est exactement la
#      définition de Silman : « an imbalance is any significant difference in the
#      two respective positions. » Les rares axes non comparables (un état
#      partagé, ex. le régime de la position) sont marqués comme tels par leurs
#      valeurs. Le moteur ontology-manager n'a aucune notion de camp : ne pas
#      tenter de la simuler par des axes jumeaux `*_white` / `*_black`.
#
# ----------------------------------------------------------------------------
# ⚠️ RÈGLE D'ADMISSION D'UN AXE (adaptée de `taste`, PAS reprise telle quelle)
# ----------------------------------------------------------------------------
# Le T1/T2 de `taste-vocabulary` (discrimination mesurée sur un corpus de goût)
# ne s'applique PAS ici : les concepts des échecs ne sont pas à découvrir dans
# des données, ils sont déjà stabilisés par un siècle de littérature. La règle
# qui les remplace tient en deux tests, les DEUX obligatoires :
#
#   A1 — ATTESTATION. Le concept porte un nom employé par un auteur identifié du
#        corpus (cf. docs/vocabulaire-perception-echecs.md). Pas de terme inventé
#        pour combler une symétrie de tableau.
#
#   A2 — CALCULABILITÉ. Il existe une règle de calcul déterministe, écrite, qui
#        rend la valeur depuis `fen` / `rules` / `engine`. Un axe dont personne ne
#        sait dire comment il se calcule n'entre pas, même s'il est célèbre.
#
# Un axe entre TOUJOURS en `status: probation`, sans exception. Il ne passe
# `active` qu'une fois son calcul IMPLÉMENTÉ et vérifié sur des positions de
# référence issues du corpus — pas sur un raisonnement, même juste. C'est la
# leçon de `taste-vocabulary`, qui a posé un axe `active` le jour de sa création
# sur une bonne histoire et zéro mesure.
#
# ----------------------------------------------------------------------------
# CE QUE LE CORPUS A CHANGÉ par rapport à la liste de facettes initiale
# ----------------------------------------------------------------------------
#  - `statics_dynamics` est une FACETTE, pas une métadonnée : trois auteurs
#    indépendants la posent (Nimzowitsch « static weakness / dynamic strength »,
#    Lasker l'axe de durabilité, Silman sa 10e imbalance).
#  - `elasticity` a été AJOUTÉE : Nimzowitsch (« capacity for manœuvring »),
#    Lasker (« increase the range of possible plans to follow without specifying
#    too early ») et Capablanca (« freedom of manoeuvre ») la nomment séparément.
#    Aucune liste moderne ne la porte.
#  - `cooperation` a été SÉPARÉE de la mobilité, parce que Lasker les sépare :
#    la distance entre pièces n'est qu'« a first, though inexact, measure ».
#  - `space` est SCINDÉE : occuper n'est pas contrôler (Nimzowitsch : « would it
#    ever occur to me to speak of a conquest of the terrain? Obviously not »).
#  - `line_control` et `square_control` sont des facettes de plein droit, comme
#    chez Silman, et non des sous-cas de l'activité des pièces.
#  - `regime` a été AJOUTÉE : Lasker impose un troisième état, `balanced`, où le
#    bon plan n'est ni attaquer ni défendre mais « to maintain the co-operation
#    of his pieces ». Une ontologie qui ne dit que « qui est mieux » le perd.
#
# ----------------------------------------------------------------------------
# ⚠️ CE QUE CETTE ONTOLOGIE NE FAIT PAS
# ----------------------------------------------------------------------------
#  - Elle décrit UNE position (un FEN), pas une trajectoire de partie. Les plans,
#    l'initiative dans la durée, la montée de tension sur plusieurs coups sont
#    hors périmètre v0.
#  - Elle ne dit pas comment AGRÉGER ses facettes en un score. Lasker démontre
#    que la somme pondérée est fausse : « This value, at least, cannot be
#    compared to a sum of weights » — et la qualifie d'« a shot that hits near
#    the centre but not the bull's-eye ». Utile, mais fausse : si un consommateur
#    additionne, il doit savoir qu'il approxime.
#  - Elle ne porte AUCUN vocabulaire sensoriel (chaleur, rayonnement, poids).
#    Mesuré : 0 occurrence de `radiate` chez Nimzowitsch, Lasker et Capablanca ;
#    et les maîtres interrogés par Binet en 1894 décrivent la couleur comme la
#    première chose que la perception efface. Ce registre existe bel et bien chez
#    les pédagogues modernes (Silman « the heat down the a1-h8 diagonal »), mais
#    c'est un dispositif de TRANSMISSION. Sa place est dans la restitution — la
#    voix, le futur rendu visuel — pas dans le modèle d'état.
# ============================================================================

version: "0.8.0"        # SemVer. Bump = tout consommateur épinglé détecte le drift.
                          # 0.2.0 — deux valeurs ajoutées au contact de l'implémentation :
                          #   seventh_rank.both       (les deux camps tiennent leur 7e)
                          #   shelter_integrity.not_castled (rien à juger avant le roque)
                          # Les ajouter valait mieux que forcer une valeur voisine, ce qui
                          # aurait produit une donnée fausse et illisible.
                          # 0.3.0 — 14 axes passent `probation` -> `active` : leur calcul est
                          # implémenté dans web/src/chess/position-analysis.js ET vérifié sur
                          # positions de référence (web/src/chess/position-analysis.test.js).
                          # Les 18 autres restent `probation` : aucun calcul ne les rend.
                          # 0.4.0 — 15 axes de plus passent `active`. Ne restent en
                          # `probation` que les TROIS axes `source: engine`
                          # (initiative_holder, position_regime, compensation) : ils
                          # exigent un appel Stockfish, donc un second étage d'analyse
                          # asynchrone — choix d'architecture non tranché.
                          # 0.7.0 — deux relations d'OMISSION, étage plan (spec 2026-10-06) :
                          #   forgoes (renonce) et ignores (laisse). `allows` ne couvrait pas
                          #   5.Df3 : …Dxe5+ existait AVANT le coup. Détection statique seule
                          #   (pièce en l'air, mat en un), aucune recherche (ADR 0004, ADR 0015).
                          # 0.8.0 — trades_queens_behind, premier tour de la boucle §5 : la
                          #   perte de 9.Dxf5 au pilote n'avait aucune raison (ADR 0017,
                          #   rapport 2026.10.06_ontologie-boucle-1-sonde.md).

# ----------------------------------------------------------------------------
# ⚠️ SEUILS — CONVENTIONS DE L'IMPLÉMENTATION, SOURCÉES PAR PERSONNE
# ----------------------------------------------------------------------------
# Les paliers ci-dessous découpent des mesures continues (contrainte C2). AUCUN
# auteur du corpus ne les donne : ce sont des choix d'implémentation, défendables
# mais arbitraires, et ils deviendraient autoritaires en silence si ce bloc
# n'existait pas. Ils vivent dans web/src/chess/position-analysis.js.
#
#   material_balance     0,5 / 2 / 4,5 pions      -> slight / clear / decisive
#   terrain_control      4 cases d'écart
#   pawn_advance_edge    2 rangs cumulés d'écart
#   position_character   locked >= 3 && pions >= 12 -> blocked
#   piece_cooperation    3 liens de défense d'écart
#   piece_elasticity     2 pièces d'écart
#   minor_piece_fit      3 cases de portée d'écart
#   king_safety_*        exposition >= 4 -> exposé ; >= 7 -> critique
#   plan_openness        théâtre = poussée de pion disponible + 2 pièces qui y portent
#
# Calibrage attendu : un corpus de positions annotées, pas une discussion.
slug: chess-vocabulary
kind: chess

# ============================================================================
# TYPES D'ENTITÉS — ce qui peuple une position
# ----------------------------------------------------------------------------
# L'unité de cette ontologie n'est PAS la case : c'est la relation. Nimzowitsch
# ne nomme presque que des objets relationnels ou partitionnels (`contact`,
# `corridor`, `two theatres of war`, `pivot`, `reflex weakness`). Les entités
# ci-dessous existent pour porter les relations de la section suivante.
# ============================================================================
entity_types:

  - key: position
    label: "Position — un FEN, l'unité d'état de cette ontologie"
    subtypes:
      - { key: opening,    label: "Ouverture" }
      - { key: middlegame, label: "Milieu de partie" }
      - { key: endgame,    label: "Finale" }

  # Les quatre classes de Lasker, avec sa règle de priorité : « the value of the
  # points: the weak points, the strong points, the important points, the less
  # essential points. […] The effect upon those is decisive; all else is of
  # secondary importance. »
  - key: square
    label: "Case, qualifiée par sa valeur (Lasker)"
    subtypes:
      - { key: weak_point,           label: "Point faible — indéfendable par un pion" }
      - { key: strong_point,         label: "Point fort — tenu et non attaquable par un pion" }
      - { key: important_point,      label: "Point important — décisif pour le plan en cours" }
      - { key: less_essential_point, label: "Point secondaire" }

  - key: piece
    label: "Pièce"
    subtypes:
      - { key: pawn,   label: "Pion" }
      - { key: knight, label: "Cavalier" }
      - { key: bishop, label: "Fou" }
      - { key: rook,   label: "Tour" }
      - { key: queen,  label: "Dame" }
      - { key: king,   label: "Roi" }

  # Les sept formes de pions de Lasker (il les classe par valeur : phalange la
  # plus forte, pion doublé la plus faible) + les objets nommés par Nimzowitsch.
  - key: pawn_formation
    label: "Formation de pions"
    subtypes:
      - { key: phalanx,          label: "Phalange — deux pions côte à côte (Lasker, le plus fort)" }
      - { key: chain,            label: "Chaîne de pions, avec sa base (Nimzowitsch)" }
      - { key: isolani,          label: "Pion dame isolé (Nimzowitsch)" }
      - { key: doubled,          label: "Pion doublé (Lasker, le plus faible)" }
      - { key: backward,         label: "Pion arriéré" }
      - { key: blocked,          label: "Pion bloqué" }
      - { key: isolated,         label: "Pion isolé" }
      - { key: blocked_isolated, label: "Pion isolé et bloqué (Lasker : « particularly weak »)" }
      - { key: hanging,          label: "Pions pendants (Nimzowitsch)" }
      - { key: passed,           label: "Pion passé" }
      - { key: candidate,        label: "Pion candidat au passage (Nimzowitsch : « candidate »)" }

  - key: line
    label: "Ligne — support des « lignes de force » décrites par les joueurs"
    subtypes:
      - { key: file,     label: "Colonne" }
      - { key: rank,     label: "Rangée" }
      - { key: diagonal, label: "Diagonale" }

  - key: zone
    label: "Zone du plateau"
    subtypes:
      - { key: centre,          label: "Centre propre — d4, d5, e4, e5 (Lasker)" }
      - { key: extended_centre, label: "Centre étendu — c3-c6 à f3-f6 (Lasker)" }
      - { key: kingside,        label: "Aile roi" }
      - { key: queenside,       label: "Aile dame" }
      - { key: king_zone,       label: "Zone du roi — son abri et ses accès" }
      - { key: theatre,         label: "Théâtre d'opérations (Nimzowitsch : « two theatres of war »)" }

  # Le mot de Rowson : « the whole kingside constellation has changed […] when he
  # moves a pawn, he is moving a whole group of pawns. » C'est l'étage « groupe »
  # de la perception, et le grain mesuré par Soltis est de 16 à 20 cases.
  - key: constellation
    label: "Constellation — groupe de pièces perçu comme une unité (Rowson)"
    subtypes:
      - { key: castled_shelter, label: "Abri du roi après le roque" }
      - { key: fianchetto,      label: "Fianchetto" }
      - { key: battery,         label: "Batterie — pièces alignées sur une même ligne" }
      - { key: wedge,           label: "Coin enfoncé dans le camp adverse (Capablanca : « wedge formation »)" }
      - { key: cluster,         label: "Amas de pièces sans fonction commune" }

  # Nimzowitsch dit `outpost`, Lasker dit `advance post` — un seul objet, deux
  # noms attestés. Lasker le relie causalement au trou et au pion arriéré.
  - key: advance_post
    label: "Avant-poste (Lasker « advance post », Nimzowitsch « outpost »)"

  # Une entité rare et précieuse : un SEGMENT de ligne, pas une case ni une pièce.
  # Nimzowitsch : « the space between pinning and pinned pieces and that between
  # the pinned and the screened pieces ».
  - key: corridor
    label: "Corridor — segment entre cloueur, cloué et pièce écrantée (Nimzowitsch)"

  - key: target
    label: "Cible — faiblesse fixée et attaquable (Lasker : « that Pawn therefore becomes the target »)"

  - key: move
    label: "Coup — un coup légal désigné en SAN, l'unité de l'étage plan (issue #7 point 4)"

  - key: threat
    label: "Menace immédiate"
    subtypes:
      - { key: fork,               label: "Fourchette" }
      - { key: pin,                label: "Clouage" }
      - { key: skewer,             label: "Enfilade" }
      - { key: discovered_attack,  label: "Attaque à la découverte" }
      - { key: double_attack,      label: "Attaque double" }
      - { key: mate_net,           label: "Réseau de mat" }
      - { key: hanging_piece,      label: "Pièce en l'air, non défendue et attaquée" }
      - { key: overload,           label: "Surcharge (Lasker : « overburdened with functions »)" }
      - { key: zugzwang,           label: "Zugzwang (Nimzowitsch, laissé en allemand par son traducteur)" }

# ============================================================================
# TYPES DE RELATIONS — le cœur du modèle
# ----------------------------------------------------------------------------
# Un joueur fort ne voit pas des pièces, il voit ce qu'elles font. Gœtz, 1894 :
# « un fou n'est pas pour mon œil intérieur une pièce tournée plus ou moins
# baroquement, c'est une force oblique. » Arnous de Rivière : « la représentation
# de lignes mobiles qui s'entre-croisent ; c'est de la géométrie de situation. »
# Tisdall, 1997 : « lines of force and movement dominate. »
# ============================================================================
relationship_types:
  - { key: occupies,      from: piece,          to: square,         label: "occupe" }
  - { key: controls,      from: piece,          to: square,         label: "contrôle (≠ occupe — Nimzowitsch)" }
  - { key: attacks,       from: piece,          to: piece,          label: "attaque" }
  - { key: defends,       from: piece,          to: piece,          label: "défend" }
  - { key: bears_on,      from: piece,          to: line,           label: "porte sur la ligne (Lasker : « bear on »)" }
  - { key: guards,        from: piece,          to: square,         label: "assure une fonction de garde (Lasker : « function »)" }
  - { key: blockades,     from: piece,          to: pawn_formation, label: "bloque (Nimzowitsch : « blockader »)" }
  - { key: overprotects,  from: piece,          to: square,         label: "surprotège (Nimzowitsch : « over-protection »)" }
  - { key: contacts,      from: piece,          to: piece,          label: "est en contact avec (Nimzowitsch : « contact »)" }
  - { key: pins,          from: piece,          to: piece,          label: "cloue" }
  - { key: screens,       from: piece,          to: piece,          label: "écrante — la pièce derrière le cloué" }
  - { key: belongs_to,    from: piece,          to: constellation,  label: "appartient à la constellation (Rowson)" }
  - { key: posts,         from: piece,          to: advance_post,   label: "occupe l'avant-poste" }
  - { key: targets,       from: piece,          to: target,         label: "vise la cible" }
  - { key: partitions,    from: pawn_formation, to: zone,           label: "partitionne le plateau en théâtres (Nimzowitsch)" }
  - { key: weakens,       from: pawn_formation, to: square,         label: "affaiblit — y compris à distance (Nimzowitsch : « reflex weakness »)" }
  - { key: creates,       from: pawn_formation, to: square,         label: "crée un trou en avançant (Capablanca)" }
  - { key: spans,         from: corridor,       to: square,         label: "traverse la case" }
  - { key: located_in,    from: square,         to: zone,           label: "appartient à la zone" }
  - { key: carries,       from: position,       to: threat,         label: "porte la menace" }

  # Étage PLAN — relations coup -> coup (issue #7 point 4). Ces cinq-là ne décrivent
  # pas la position : elles décrivent ce qu'un coup FAIT au champ des coups possibles.
  # Elles servent à EXPLIQUER un candidat, jamais à le produire ni à le justifier
  # tactiquement (ADR 0004).
  - { key: enables,       from: move,           to: move,           label: "permet — rend disponible un de MES coups" }
  - { key: excludes,      from: move,           to: move,           label: "exclut — me prive d'un de MES coups" }
  - { key: prevents,      from: move,           to: move,           label: "prévient — retire un coup à l'ADVERSAIRE" }
  - { key: allows,        from: move,           to: move,           label: "concède — offre un coup neuf à l'ADVERSAIRE" }
  - { key: frees,         from: move,           to: square,         label: "libère — quitte une case qu'un des miens peut reprendre" }

  # Étage PLAN, omissions (0.7.0) : ce qu'un coup NE fait PAS. Ce que le coup aurait pu prendre ou
  # parer se lit sur la position AVANT le coup, sans recherche de variantes (ADR 0015).
  - { key: forgoes,       from: move,           to: move,           label: "renonce — passe à côté d'un gain à MOI : pièce en l'air, mat en un (Heisman : blunder check)" }
  - { key: ignores,       from: move,           to: move,           label: "laisse — ne pare pas une menace ADVERSE déjà présente (de la Maza : balayage)" }

  # Étage PLAN, bilan matériel (0.8.0) : une règle SOURCÉE sur le matériel, sans gain ni perte
  # immédiats. Lue sur la position avant le coup, sans recherche (ADR 0017).
  - { key: trades_queens_behind, from: move,    to: move,           label: "échange les dames en retard de matériel (Capablanca : « exchange Queens when he is a Pawn behind »)" }

# ============================================================================
# SOURCES — d'où sort une valeur
# ----------------------------------------------------------------------------
# Trois sources, toutes déterministes et calculables en temps réel. AUCUNE source
# LLM (contrainte C1). Nommer la source est ce qui rend un axe ré-annotable : un
# axe dont on ne sait pas d'où vient la valeur n'est pas auditable.
# ============================================================================
value_sources:
  - { key: fen,    label: "Lecture directe du FEN — placement, trait, roques, prise en passant" }
  - { key: rules,  label: "Géométrie des coups légaux (chess.js) — attaques, contrôle, mobilité" }
  - { key: engine, label: "Stockfish — évaluation, meilleur coup, profondeur atteinte" }

# ============================================================================
# AXES DE QUALIFICATION
# ----------------------------------------------------------------------------
# Chaque axe : `facet`, `nature` (factual|measured), `source`, `cardinality`
# (single|multi), `status` (probation au départ, SANS EXCEPTION — cf. règle
# d'admission), et un enum FERMÉ. Les axes sont découverts dans ce YAML : en
# ajouter un ne coûte aucune ligne de Python.
#
# Les valeurs sont COMPARATIVES (contrainte C3) : elles disent l'écart entre les
# deux camps, pas l'état d'un camp.
# ============================================================================
axes:

  # ==========================================================================
  # FACETTE — MATERIAL (Silman, 4e imbalance : « The Philosophy of Greed »)
  # ==========================================================================
  - key: material_balance
    facet: material
    label: "Écart matériel, en paliers"
    nature: factual
    source: fen
    cardinality: single
    status: active
    values:
      - { key: balanced,        label: "Équilibré — écart sous le pion" }
      - { key: white_slight,    label: "Léger avantage blanc — de l'ordre du pion" }
      - { key: white_clear,     label: "Avantage blanc net — de l'ordre de la pièce" }
      - { key: white_decisive,  label: "Avantage blanc décisif" }
      - { key: black_slight,    label: "Léger avantage noir" }
      - { key: black_clear,     label: "Avantage noir net" }
      - { key: black_decisive,  label: "Avantage noir décisif" }

  - key: bishop_pair
    facet: material
    label: "Paire de fous (Silman, 1re imbalance : « Superior Minor Piece »)"
    nature: factual
    source: fen
    cardinality: single
    status: active
    values:
      - { key: neither, label: "Aucun camp ne l'a" }
      - { key: white,   label: "Aux blancs" }
      - { key: black,   label: "Aux noirs" }

  # Capablanca convertit l'inactivité en matériel : « Often a Bishop or a Knight
  # is completely put out of action. In such cases […] for all practical purposes
  # there will be one more piece on one side than on the other. »
  - key: pieces_out_of_action
    facet: material
    label: "Pièces hors jeu, comptées comme du matériel absent (Capablanca)"
    nature: measured
    source: rules
    cardinality: single
    status: active
    values:
      - { key: none,       label: "Aucune" }
      - { key: white_has,  label: "Les blancs en ont une ou plus" }
      - { key: black_has,  label: "Les noirs en ont une ou plus" }
      - { key: both,       label: "Les deux camps" }

  # ==========================================================================
  # FACETTE — PAWN_STRUCTURE (Silman, 2e imbalance)
  # ==========================================================================
  - key: pawn_islands
    facet: pawn_structure
    label: "Écart d'îlots de pions — moins d'îlots vaut mieux"
    nature: factual
    source: fen
    cardinality: single
    status: active
    values:
      - { key: equal,       label: "Autant d'îlots des deux côtés" }
      - { key: white_fewer, label: "Les blancs en ont moins" }
      - { key: black_fewer, label: "Les noirs en ont moins" }

  - key: pawn_defects
    facet: pawn_structure
    label: "Défauts de structure présents dans la position"
    nature: factual
    source: fen
    cardinality: multi
    status: active
    values:
      - { key: white_isolated, label: "Pion(s) isolé(s) blanc(s)" }
      - { key: white_doubled,  label: "Pion(s) doublé(s) blanc(s)" }
      - { key: white_backward, label: "Pion(s) arriéré(s) blanc(s)" }
      - { key: white_hanging,  label: "Pions pendants blancs" }
      - { key: black_isolated, label: "Pion(s) isolé(s) noir(s)" }
      - { key: black_doubled,  label: "Pion(s) doublé(s) noir(s)" }
      - { key: black_backward, label: "Pion(s) arriéré(s) noir(s)" }
      - { key: black_hanging,  label: "Pions pendants noirs" }

  # Nimzowitsch fait de l'immobilité la propriété centrale du pion, avant l'isolement
  # ou le doublement : « the passed pawn's lust to expand » a pour envers le pion qui
  # ne peut plus rien. Un pion est immobile quand sa case d'arrivée est occupée ET
  # qu'aucune prise ne lui est offerte — deux conditions lisibles dans le FEN seul.
  # PORTÉE : l'axe compte les pions, jamais les pièces. `none` dit « aucun pion bloqué
  # des deux côtés », pas « non mesuré » — la valeur est toujours calculable.
  - key: pawn_immobility
    facet: pawn_structure
    label: "Écart de pions immobiles (Nimzowitsch — le pion qui ne peut plus avancer)"
    nature: factual
    source: fen
    cardinality: single
    status: active
    values:
      - { key: none,       label: "Aucun pion immobile des deux côtés" }
      - { key: white_more, label: "Les blancs ont plus de pions immobiles" }
      - { key: black_more, label: "Les noirs ont plus de pions immobiles" }
      - { key: mutual,     label: "Structure bloquée des deux côtés, sans écart net" }

  # Capablanca : « a passed Pawn is either very weak or very strong, and […] its
  # weakness or strength […] is in direct relation to the number of pieces on the
  # board. » Le pion passé n'a donc pas de valeur intrinsèque.
  - key: passed_pawn_edge
    facet: pawn_structure
    label: "Avantage en pions passés (valeur contextuelle — Capablanca)"
    nature: factual
    source: fen
    cardinality: single
    status: active
    values:
      - { key: none,          label: "Aucun pion passé" }
      - { key: white_better,  label: "Les blancs ont le pion passé le plus dangereux" }
      - { key: black_better,  label: "Les noirs ont le pion passé le plus dangereux" }
      - { key: mutual,        label: "Pions passés des deux côtés, sans avantage net" }

